<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:2500px;height:1686px;background:#f4f8f6;font-family:"Zen Kaku Gothic New","IPAGothic",sans-serif;color:#17302b}
.grid{display:grid;grid-template-columns:833px 834px 833px;grid-template-rows:843px 843px;width:2500px;height:1686px}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:56px;border-right:6px solid #d3e3dd;border-bottom:6px solid #d3e3dd;background:#fff}
.cell:nth-child(3n){border-right:0}.cell:nth-child(n+4){border-bottom:0}
.cell.alt{background:#eaf4f0}
.icon{width:250px;height:250px;border-radius:50%;background:#0f7a64;display:flex;align-items:center;justify-content:center}
.icon svg{width:150px;height:150px;fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.label{font-size:100px;font-weight:700;line-height:1.25;text-align:center;letter-spacing:.02em}
</style></head><body><div class="grid">
<div class="cell"><div class="icon"><svg viewBox="0 0 100 100"><path d="M8 30h50v38H8z"/><path d="M58 42h18l14 14v12H58z"/><circle cx="26" cy="74" r="8"/><circle cx="74" cy="74" r="8"/></svg></div><div class="label">送料・お届け</div></div>
<div class="cell alt"><div class="icon"><svg viewBox="0 0 100 100"><rect x="10" y="24" width="80" height="54" rx="8"/><path d="M10 40h80"/><path d="M22 62h22"/></svg></div><div class="label">お支払い方法</div></div>
<div class="cell"><div class="icon"><svg viewBox="0 0 100 100"><path d="M14 36l36-18 36 18v36L50 90 14 72z"/><path d="M14 36l36 18 36-18"/><path d="M50 54v36"/></svg></div><div class="label">返品・交換</div></div>
<div class="cell alt"><div class="icon"><svg viewBox="0 0 100 100"><rect x="20" y="44" width="60" height="44" rx="8"/><path d="M32 44V32a18 18 0 0 1 36 0v12"/><path d="M50 60v12"/></svg></div><div class="label">専売品の<br>購入方法</div></div>
<div class="cell"><div class="icon"><svg viewBox="0 0 100 100"><rect x="18" y="12" width="56" height="74" rx="6"/><path d="M30 32h32M30 46h32M30 60h16"/><circle cx="70" cy="70" r="13"/><path d="M80 80l10 10"/></svg></div><div class="label">ご注文状況の<br>確認</div></div>
<div class="cell alt"><div class="icon"><svg viewBox="0 0 100 100"><path d="M12 20h76v50H44L26 86V70H12z"/><path d="M30 40h40M30 54h26"/></svg></div><div class="label">その他の<br>お問い合わせ</div></div>
</div></body></html>
